name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      # Start with syntax/undefined-name checks; expand after legacy lint cleanup.
      - run: ruff check --select E9,F63,F7,F82 src tests main.py
      - run: python -m pytest -q --disable-warnings
