position_sizing:
  method: fixed_fractional  # fixed_fractional | volatility_adjusted | half_kelly
  risk_per_trade_pct: 2.0
  max_leverage: 5
  min_order_size_usd: 10

limits:
  max_open_positions: 3
  max_portfolio_heat_pct: 15.0
  max_daily_loss_pct: 5.0
  max_drawdown_pct: 15.0
  max_correlated_exposure_multiplier: 1.5

stops:
  require_stop_loss: true
  default_atr_multiplier: 2.0
  trailing_stop_enabled: true

# Consumed by both the backtester and paper-mode execution, so simulated and
# backtested fills are priced identically. Delta Exchange India, 2026-08.
costs:
  taker_fee_bps: 5.9          # 0.05% x 1.18 GST
  maker_fee_bps: 2.36         # 0.02% x 1.18 GST
  base_slippage_bps: 2.0      # floor, even for tiny orders in deep books
  impact_coef_bps: 5000.0     # bps per unit of (order notional / bar volume USD)
  vol_coef: 0.05              # widens with ATR — matters on thin symbols
  max_slippage_bps: 50.0
  funding_hours_utc: [0, 8, 16]   # 05:30 / 13:30 / 21:30 IST
  funding_bps_per_period: 1.0     # ~0.01% per 8h; sweep {0, 1, 3} for sensitivity
  max_funding_bps_per_period: 100.0

circuit_breaker:
  daily_loss_halt: true
  max_drawdown_close_all: true
  consecutive_loss_limit: 5
  consecutive_loss_size_reduction: 0.5
  data_feed_timeout_seconds: 300
  max_consecutive_api_errors: 15
  manual_resume_only: true  # no auto-resume; use `python main.py resume`
  state_file: data/circuit_breaker_state.json
  audit_file: logs/circuit_breaker_audit.log

# Venue symbols are BTCUSD/ETHUSD (not ...USDT) — the previous USDT spelling
# meant RiskManager._is_correlated_exposure never matched an open position.
correlation_groups:
  - [BTCUSD, ETHUSD]
